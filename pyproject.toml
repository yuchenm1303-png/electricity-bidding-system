[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "powerbid-lab"
version = "0.1.0"
description = "Electricity market bidding decision lab for teaching and research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "yuchenm1303-png" }]
dependencies = []

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.28,<1",
]
ui = [
  "streamlit>=1.38",
  "pandas>=2.2",
  "pywebview>=5.3,<6",
]
pypsa = [
  "pypsa>=0.35",
]
strategy = [
  "scipy>=1.11,<2",
]
network = [
  "scipy>=1.11,<2",
]
platform = [
  "requests[socks]>=2.32",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]
all = [
  "streamlit>=1.38",
  "pandas>=2.2",
  "pywebview>=5.3,<6",
  "pypsa>=0.35",
  "scipy>=1.11,<2",
  "requests[socks]>=2.32",
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
powerbid = "powerbid.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/powerbid"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
