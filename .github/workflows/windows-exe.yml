name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "data/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/windows-exe.yml"

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui]"
          pip install "pyinstaller>=6.11,<7"

      - name: Build single-file Windows executable
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm packaging/powerbid.spec
          if (-not (Test-Path "dist/PowerBidLab.exe")) {
            throw "dist/PowerBidLab.exe was not created"
          }

      - name: Smoke-check executable artifact
        shell: pwsh
        run: |
          $item = Get-Item "dist/PowerBidLab.exe"
          Write-Host "Built $($item.FullName) ($([math]::Round($item.Length / 1MB, 1)) MB)"

      - name: Prepare release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Copy-Item "dist/PowerBidLab.exe" "release/PowerBidLab.exe"
          Copy-Item "packaging/WINDOWS-README.txt" "release/README.txt"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PowerBidLab-Windows-x64
          path: release/
          if-no-files-found: error
          retention-days: 30
