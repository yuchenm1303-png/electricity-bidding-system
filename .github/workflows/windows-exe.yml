name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "data/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/windows-exe.yml"

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui]"
          pip install "pyinstaller>=6.11,<7"

      - name: Build desktop application
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm packaging/powerbid.spec
          if (-not (Test-Path "dist/PowerBidLab/PowerBidLab.exe")) {
            throw "dist/PowerBidLab/PowerBidLab.exe was not created"
          }

      - name: Smoke-test packaged application server
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "$PWD/dist/PowerBidLab/PowerBidLab.exe" -ArgumentList "--self-test" -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA "PowerBidLab/startup-error.log"
            if (Test-Path $log) { Get-Content $log }
            throw "Packaged PowerBidLab self-test failed with exit code $($proc.ExitCode)"
          }
          Write-Host "Packaged desktop application self-test passed."

      - name: Prepare release directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Compress-Archive -Path "dist/PowerBidLab/*" -DestinationPath "release/PowerBidLab-Portable-x64.zip" -Force
          Copy-Item "packaging/WINDOWS-README.txt" "release/README.txt"

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          iscc "packaging/powerbid.iss"
          if (-not (Test-Path "release/PowerBidLab-Setup-x64.exe")) {
            throw "PowerBidLab-Setup-x64.exe was not created"
          }
          $item = Get-Item "release/PowerBidLab-Setup-x64.exe"
          Write-Host "Built installer $($item.FullName) ($([math]::Round($item.Length / 1MB, 1)) MB)"

      - name: Upload Windows desktop package
        uses: actions/upload-artifact@v4
        with:
          name: PowerBidLab-Windows-x64
          path: release/
          if-no-files-found: error
          retention-days: 30
