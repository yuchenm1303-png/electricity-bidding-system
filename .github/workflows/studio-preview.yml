name: React Studio Preview
on:
  push:
    branches: ["feature/powerbid-product-ui"]
  pull_request:
    paths:
      - "frontend/**"
      - "app/web_server.py"
      - "tests/test_web_server.py"
      - "Dockerfile.studio"
      - "pyproject.toml"
      - ".github/workflows/studio-preview.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,web]"
      - run: ruff check app/web_server.py tests/test_web_server.py
      - run: pytest -q tests/test_web_server.py
